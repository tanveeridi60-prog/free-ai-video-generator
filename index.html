<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free AI Video Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#090d22;color:#fff;font-family:Arial,sans-serif}
.app{max-width:720px;margin:auto}.card{background:#121936;padding:22px;border-radius:22px}
h1{margin:0 0 8px}.sub{color:#aeb8d5;margin:0 0 22px}
label{display:block;font-weight:bold;margin:17px 0 8px}
textarea,select{width:100%;padding:15px;border-radius:14px;border:1px solid #3b4770;background:#0b1230;color:white;font-size:16px}
textarea{min-height:130px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{width:100%;height:58px;margin-top:22px;border:0;border-radius:14px;background:#704df0;color:#fff;font-size:19px;font-weight:bold}
.result{margin-top:20px;padding:17px;border-radius:14px;background:#0b1230;line-height:1.5}
.progress{height:12px;background:#252f52;border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:#8b6cff;transition:.25s}
#preview{display:none;margin-top:18px;border-radius:14px;overflow:hidden;background:#000}
#preview img{width:100%;display:block}
.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#252f52;margin:4px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><div class="card">
<h1>🎬 Free AI Video Generator</h1>
<p class="sub">₹0 starter version — create an AI-style video concept without a paid API.</p>

<label>What should the video be about?</label>
<textarea id="prompt" placeholder="A superhero flying over a futuristic city at sunset..."></textarea>

<div class="row">
<div><label>Style</label><select id="style"><option>Cinematic</option><option>Anime</option><option>3D Animation</option><option>Realistic</option><option>Cartoon</option></select></div>
<div><label>Duration</label><select id="duration"><option>5 seconds</option><option>10 seconds</option><option>15 seconds</option><option>30 seconds</option></select></div>
</div>

<button onclick="generate()">✨ Generate Free Video</button>
<div id="result" class="result">Ready 🚀</div>
<div id="preview"><img id="previewImg" alt="Generated video preview"></div>

</div></div>

<script>
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function generate(){
 const p=document.getElementById('prompt').value.trim();
 const style=document.getElementById('style').value;
 const duration=document.getElementById('duration').value;
 const result=document.getElementById('result');
 const preview=document.getElementById('preview');
 const img=document.getElementById('previewImg');

 if(!p){result.textContent='⚠️ Please enter a prompt first.';return}

 let progress=0;
 result.innerHTML='🧠 Preparing your free video...<div class="progress"><div id="bar" class="bar"></div></div><span id="status">Creating scenes...</span>';
 preview.style.display='none';

 const timer=setInterval(()=>{
   progress+=10;
   document.getElementById('bar').style.width=progress+'%';
   document.getElementById('status').textContent =
     progress<40?'Creating scene...':
     progress<80?'Applying '+style+' style...':'Finalizing preview...';

   if(progress>=100){
     clearInterval(timer);
     // Free browser-only fallback: creates a visual video-card preview from the prompt.
     const canvas=document.createElement('canvas');
     canvas.width=1280;canvas.height=720;
     const ctx=canvas.getContext('2d');
     ctx.fillStyle='#111936';ctx.fillRect(0,0,canvas.width,canvas.height);
     ctx.fillStyle='#8b6cff';ctx.font='bold 46px Arial';ctx.fillText('FREE AI VIDEO',70,110);
     ctx.fillStyle='#fff';ctx.font='bold 42px Arial';
     const words=p.split(' ');let line='',y=230;
     for(const word of words){
       if((line+' '+word).length>38){ctx.fillText(line,70,y);y+=62;line=word}
       else line+=(line?' ':'')+word;
     }
     if(line)ctx.fillText(line,70,y);
     ctx.fillStyle='#aeb8d5';ctx.font='28px Arial';
     ctx.fillText(style+' • '+duration,70,640);
     img.src=canvas.toDataURL('image/png');
     preview.style.display='block';
     result.innerHTML='✅ Free preview ready!<br><br><span class="badge">No API key</span><span class="badge">₹0</span>';
   }
 },180);
}
</script>
</body>
</html>
